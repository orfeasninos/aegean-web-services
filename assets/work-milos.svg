<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Stylised browser mockup: Milos.guide travel guide -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d6f8f"/><stop offset=".55" stop-color="#1a4a6b"/><stop offset="1" stop-color="#0f2d4a"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1f33" stop-opacity=".75"/><stop offset=".6" stop-color="#0b1f33" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="#e2e8f0"/>
  <rect x="40" y="40" width="720" height="460" rx="14" fill="#fff"/>
  <rect x="40" y="40" width="720" height="36" rx="14" fill="#f1f5f9"/>
  <circle cx="66" cy="58" r="6" fill="#f87171"/><circle cx="86" cy="58" r="6" fill="#fbbf24"/><circle cx="106" cy="58" r="6" fill="#34d399"/>
  <rect x="200" y="48" width="400" height="20" rx="10" fill="#fff"/>
  <clipPath id="vp"><rect x="40" y="76" width="720" height="424"/></clipPath>
  <g clip-path="url(#vp)">
    <!-- top nav -->
    <rect x="40" y="76" width="720" height="34" fill="#fff"/>
    <text x="96" y="99" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0f2d4a">Milos<tspan font-size="11" font-weight="400" fill="#2d6f8f">.guide</tspan></text>
    <rect x="420" y="90" width="26" height="6" rx="3" fill="#94a3b8"/><rect x="456" y="90" width="26" height="6" rx="3" fill="#94a3b8"/><rect x="492" y="90" width="38" height="6" rx="3" fill="#94a3b8"/><rect x="540" y="90" width="30" height="6" rx="3" fill="#94a3b8"/><rect x="580" y="90" width="38" height="6" rx="3" fill="#94a3b8"/>
    <rect x="634" y="84" width="74" height="18" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
    <!-- sea hero with island silhouette -->
    <rect x="40" y="110" width="720" height="340" fill="url(#sea)"/>
    <path d="M40 140 L120 128 L210 136 L300 122 L380 132 L470 120 L560 130 L650 124 L760 134 L760 150 L40 150Z" fill="#6b7f8c" opacity=".55"/>
    <path d="M40 150 H760" stroke="#9cc3d6" stroke-width="1" opacity=".4"/>
    <path d="M520 230q24-8 48 0t48 0M600 300q24-8 48 0t48 0M470 360q24-8 48 0t48 0M650 400q24-8 48 0t48 0" stroke="#9cd2e6" stroke-width="2" fill="none" opacity=".35"/>
    <rect x="40" y="110" width="720" height="340" fill="url(#shade)"/>
    <!-- copy -->
    <rect x="96" y="168" width="150" height="14" rx="7" fill="#fff" opacity=".18"/>
    <text x="94" y="250" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#fff">Milos</text>
    <rect x="96" y="266" width="150" height="8" rx="4" fill="#cfe3ee" opacity=".75"/>
    <rect x="96" y="288" width="230" height="6" rx="3" fill="#fff" opacity=".55"/>
    <rect x="96" y="300" width="210" height="6" rx="3" fill="#fff" opacity=".55"/>
    <rect x="96" y="324" width="66" height="24" rx="5" fill="#fff"/>
    <rect x="170" y="324" width="66" height="24" rx="5" fill="#fff" opacity=".2" stroke="#fff" stroke-opacity=".5"/>
    <!-- stats -->
    <g font-family="Georgia, serif" font-size="15" font-weight="700" fill="#fff">
      <rect x="96" y="372" width="56" height="44" rx="6" fill="#0b1f33" opacity=".5" stroke="#fff" stroke-opacity=".25"/><text x="106" y="395">70+</text>
      <rect x="160" y="372" width="48" height="44" rx="6" fill="#0b1f33" opacity=".5" stroke="#fff" stroke-opacity=".25"/><text x="170" y="395">151</text>
      <rect x="216" y="372" width="56" height="44" rx="6" fill="#0b1f33" opacity=".5" stroke="#fff" stroke-opacity=".25"/><text x="226" y="395">125</text>
      <rect x="280" y="372" width="76" height="44" rx="6" fill="#0b1f33" opacity=".5" stroke="#fff" stroke-opacity=".25"/><text x="290" y="395">~5,000</text>
    </g>
    <g fill="#cfe3ee" opacity=".6"><rect x="106" y="404" width="34" height="4" rx="2"/><rect x="170" y="404" width="22" height="4" rx="2"/><rect x="226" y="404" width="34" height="4" rx="2"/><rect x="290" y="404" width="50" height="4" rx="2"/></g>
    <!-- wave into cream section -->
    <path d="M40 440 Q400 470 760 440 V500 H40Z" fill="#f6f1e7"/>
  </g>
</svg>
